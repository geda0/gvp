AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio chat API (FastAPI + Gemini on Lambda container, HTTP API).

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google AI Studio / Gemini API key (required for real traffic; pass via deploy — no template default).
  GeminiModel:
    Type: String
    Default: gemini-3.1-flash-lite
    Description: >
      Primary Gemini API model id (see https://ai.google.dev/gemini-api/docs/models ).
      Default Gemini 3.1 Flash Lite (gemini-3.1-flash-lite).
  GeminiFallbackModel:
    Type: String
    Default: gemma-4-26b-a4b-it
    Description: >
      Fallback model when the primary returns rate limits (429 / quota). Default Gemma 4 26B A4B IT.
  GeminiLiveModel:
    Type: String
    Default: gemini-3.1-flash-live-preview
    Description: >
      Gemini Live API model id for browser voice sessions (Multimodal Live / BidiGenerateContent).
      Overridable at runtime by CHAT_VOICE_MODEL when that env is non-empty (same container).
  ChatVoiceModel:
    Type: String
    Default: ''
    Description: >
      Optional voice-only Live model id (maps to CHAT_VOICE_MODEL). When empty, voice uses GeminiLiveModel / GEMINI_LIVE_MODEL only.
  ChatCorsOrigins:
    Type: String
    Default: 'https://chat.marwanelgendy.link,https://marwanelgendy.link,https://www.marwanelgendy.link'
    Description: Comma-separated browser origins for CHAT_CORS_ORIGINS in the function (FastAPI CORS; apex and www variants are expanded automatically for two-label hosts).
  ChatTranscriptsTableName:
    Type: String
    Default: ''
    Description: Optional external DynamoDB table for transcript persistence (from contact stack output).
  ChatErrorAlarmEmail:
    Type: String
    Default: ''
    Description: Optional email for SNS when chat Lambda errors exceed alarm threshold (empty skips alarm).
  SmokeProbeKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Probe-scoped secret validated by /api/chat/smoke (x-smoke-key). Distinct from the contact admin key.
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: 'Resend API key for instant chat-degradation alerts. Empty leaves alerts dark (no-op).'
  ChatAlertEmail:
    Type: String
    Default: ''
    Description: 'Recipient for instant chat alerts (model switch / timeout / rate-limit / breakage). Empty leaves alerts dark.'
  ChatAlertFromEmail:
    Type: String
    Default: ''
    Description: 'From address for instant chat alerts (a verified Resend sender). Empty leaves alerts dark.'
  StageName:
    Type: String
    Default: stage
    AllowedValues: [stage, prod]
    Description: Environment label (surfaced as CHAT_ENV in alert subjects).

Conditions:
  HasChatTranscriptsTable: !Not [!Equals [!Ref ChatTranscriptsTableName, '']]
  HasChatErrorAlarm: !Not [!Equals [!Ref ChatErrorAlarmEmail, '']]

Globals:
  Function:
    Timeout: 60
    MemorySize: 1536
    Architectures:
      - x86_64

Resources:
  ChatHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Conservative stage-level throttling — protects the Gemini API key from
      # cost abuse on a personal portfolio chat endpoint.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  # ADR-0022 §29 (DECISION 8) — Tier 2 of invariant 19 needs a log group THIS STACK
  # owns: a MetricFilter cannot attach to a group that does not exist, and Lambda's
  # auto-created /aws/lambda/<fn> does not exist until the first invocation, so a
  # fresh PROD stack would fail. A NEW name (not /aws/lambda/<fn>) also avoids the
  # "already exists" collision on the deployed stage stack and leaves its logs —
  # including the §25.3-M evidence — intact. No IAM change needed: the basic
  # execution policy grants logs:* on Resource "*". RetentionInDays is chosen on
  # EVIDENCE, not cost (§29.2) — Logs bills ingestion, which retention never cuts.
  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/gvp/chat/${StageName}'
      RetentionInDays: 30

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: docker/chat/Dockerfile.lambda
    Properties:
      PackageType: Image
      LoggingConfig:
        LogGroup: !Ref ChatLogGroup
      Policies:
        - !If
          - HasChatTranscriptsTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatTranscriptsTableName}
          - !Ref AWS::NoValue
      Environment:
        Variables:
          CHAT_PROVIDER: gemini
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_FALLBACK_MODEL: !Ref GeminiFallbackModel
          GEMINI_LIVE_MODEL: !Ref GeminiLiveModel
          CHAT_VOICE_MODEL: !Ref ChatVoiceModel
          CHAT_LIVE_RELAY: '0'
          CHAT_LIVE_VOICE_STRICT: '0'
          CHAT_CORS_ORIGINS: !Ref ChatCorsOrigins
          CHAT_TRANSCRIPTS_TABLE: !Ref ChatTranscriptsTableName
          SMOKE_PROBE_KEY: !Ref SmokeProbeKey
          RESEND_API_KEY: !Ref ResendApiKey
          CHAT_ALERT_EMAIL: !Ref ChatAlertEmail
          CHAT_ALERT_FROM_EMAIL: !Ref ChatAlertFromEmail
          CHAT_ENV: !Ref StageName
      Events:
        RootAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatHttpApi
            Path: /
            Method: ANY
        ProxyAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatHttpApi
            Path: /{proxy+}
            Method: ANY

  ChatErrorTopic:
    Type: AWS::SNS::Topic
    Condition: HasChatErrorAlarm
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref ChatErrorAlarmEmail

  ChatLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasChatErrorAlarm
    Properties:
      AlarmDescription: Chat Lambda errors (sum over 5 minutes).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ChatErrorTopic

  # ADR-0022 §29.4 — Tier 2 for this host. QUOTED-TERM pattern, prefix only.
  # MEASURED 2026-10-07: the CHAT_ALERT line can arrive CONCATENATED behind a
  # traceback tail inside ONE CloudWatch event, so a space-delimited pattern
  # ([level="[WARNING]", ts, reqid, ...]) would not have matched either real
  # event; a quoted term matches anywhere in the event and does. That also rules
  # out per-type metric Dimensions, which can only take values from named fields
  # of a JSON or space-delimited pattern — hence ONE metric for all six event
  # types. MetricName carries host+env because a metric filter cannot set a
  # STATIC dimension: without it, stage and prod publish to the same metric and
  # each alarms on the other's alert lines.
  ChatAlertMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ChatLogGroup
      FilterPattern: '"CHAT_ALERT event="'
      MetricTransformations:
        - MetricNamespace: GvpChat
          MetricName: !Sub 'ChatAlertLines-httpapi-${StageName}'
          MetricValue: '1'
          # Publishes 0 for a NON-matching ingested event, so OK means the filter
          # ran and saw none, instead of INSUFFICIENT_DATA which is
          # indistinguishable from a broken filter. Limit: on an IDLE function
          # there is no event at all, so this is not a heartbeat.
          DefaultValue: 0

  # REUSES ChatErrorTopic (§29.4). The logical ID is deliberately NOT renamed even
  # though "Error" is now a misnomer: renaming deletes and recreates the topic,
  # discarding its email subscription and minting a fresh UNCONFIRMED one. Prefer
  # a wrong name to a deleted subscription.
  # PRECONDITION, MEASURED 2026-10-07: this topic's only subscription was
  # PendingConfirmation, so ChatLambdaErrorsAlarm could never have delivered.
  # Confirm it, then verify with the list-subscriptions check in §29.5.
  ChatAlertLinesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasChatErrorAlarm
    Properties:
      AlarmName: !Sub 'gvp-chat-${StageName}-tier1-alert-line'
      AlarmDescription: >
        A CHAT_ALERT Tier-1 line was written (invariant 19 Tier 2, ADR-0022 §29).
        Says THAT one of six alert types fired, never WHICH — read the type from
        the log group: aws logs filter-log-events --log-group-name /gvp/chat/<env>
        --filter-pattern '"CHAT_ALERT event="' --start-time <epoch-ms>
      Namespace: GvpChat
      MetricName: !Sub 'ChatAlertLines-httpapi-${StageName}'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ChatErrorTopic

Outputs:
  ChatPostApiUrl:
    Description: >
      Full URL for POST /api/chat (hero text) — use in gvp:chat-api-url meta.
      Same API origin also serves POST /api/live/session, GET /health, GET /ready.
      Voice: CHAT_LIVE_RELAY=0 (browser direct_google); set CHAT_LIVE_VOICE_STRICT=1 to return 503 on POST /api/live/session without minting. ECS: CHAT_LIVE_RELAY=1 for relay. Session JSON includes voiceBrowserExperience and voiceHint.
    Value: !Sub https://${ChatHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/chat
  ChatHttpApiId:
    Value: !Ref ChatHttpApi
  ChatApiBaseUrl:
    Value: !Sub https://${ChatHttpApi}.execute-api.${AWS::Region}.amazonaws.com
